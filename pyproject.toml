[project]
name = "digital_policy_change_request_system"
version = "0.1.0"
description = "digital_policy_change_request_system using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.28,<2.0.0",
    "flask>=3.1.3",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digital_policy_change_request_system"]

[tool.crewai]
type = "flow"
definition = "src/digital_policy_change_request_system/flow.json"
project_id = "de7363e6-0e63-487b-9509-6e27f2c05035"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
constraint-dependencies = ["crewai==1.15.28"]
